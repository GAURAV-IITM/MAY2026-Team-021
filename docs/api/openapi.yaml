components:
  schemas:
    AcceptInvitationRequest:
      properties:
        token:
          type: string
          maxLength: 512
          minLength: 32
          title: Token
        password:
          type: string
          maxLength: 128
          minLength: 8
          title: Password
      type: object
      required:
      - token
      - password
      title: AcceptInvitationRequest
    AcceptInvitationResponse:
      properties:
        message:
          type: string
          title: Message
        email:
          type: string
          title: Email
      type: object
      required:
      - message
      - email
      title: AcceptInvitationResponse
    AllocationStatus:
      type: string
      enum:
      - active
      - completed
      - cancelled
      title: AllocationStatus
    AuthResponse:
      properties:
        accessToken:
          type: string
          title: Accesstoken
        refreshToken:
          type: string
          title: Refreshtoken
        tokenType:
