openapi: 3.1.0
info:
  title: Smart Library API
  description: Contract for the Smart Library App. Library-owned resources are tenant-scoped from the
    authenticated membership.
  version: 0.1.0
  contact:
    name: MAY2026-Team-021
paths:
  /api/v1/auth/register-library:
    post:
      tags:
      - Authentication
      summary: Register a library and owner
      description: Creates the library, owner account, active membership, settings, default shifts, first
        floor, requested seats, and an API token session.
      operationId: registerLibraryWithTokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterLibraryRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '409':
          description: The request conflicts with existing data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '422':
          description: Request validation or a business rule failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
      x-user-stories:
      - AUTH-REGISTER-LIBRARY
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Log in and return API tokens
      operationId: loginWithTokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          description: Authentication is required or the session is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
