components:
  schemas:
    AcceptInvitationRequest:
      properties:
        token:
          type: string
          maxLength: 512
          minLength: 32
          title: Token
        password:
          type: string
          maxLength: 128
          minLength: 8
          title: Password
      type: object
      required:
      - token
      - password
      title: AcceptInvitationRequest
    AcceptInvitationResponse:
      properties:
        message:
          type: string
          title: Message
        email:
          type: string
          title: Email
      type: object
      required:
      - message
      - email
      title: AcceptInvitationResponse
    ActivityActor:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
      type: object
      required:
      - id
      - name
      title: ActivityActor
    AgeingItem:
      properties:
        key:
          type: string
          title: Key
        label:
          type: string
          title: Label
        count:
          type: integer
          minimum: 0.0
          title: Count
        studentCount:
          type: integer
          minimum: 0.0
          title: Studentcount
        outstandingAmount:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Outstandingamount
      type: object
      required:
      - key
      - label
      - count
      - studentCount
      - outstandingAmount
      title: AgeingItem
    AllocationActorSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
      type: object
      required:
      - id
      - name
      title: AllocationActorSummary
    AllocationSeatSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        seatNumber:
          type: string
          title: Seatnumber
        floorId:
          type: string
          format: uuid
          title: Floorid
        floorName:
          type: string
          title: Floorname
      type: object
      required:
      - id
      - seatNumber
      - floorId
      - floorName
      title: AllocationSeatSummary
    AllocationShiftSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        startTime:
          type: string
          title: Starttime
        endTime:
          type: string
          title: Endtime
        crossesMidnight:
          type: boolean
          title: Crossesmidnight
      type: object
      required:
      - id
      - name
      - startTime
      - endTime
      - crossesMidnight
      title: AllocationShiftSummary
    AllocationStatus:
      type: string
      enum:
      - active
      - completed
      - cancelled
      title: AllocationStatus
    AllocationStudentSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        enrollmentNumber:
          type: string
          title: Enrollmentnumber
        name:
          type: string
          title: Name
        status:
          type: string
          title: Status
      type: object
      required:
      - id
      - enrollmentNumber
      - name
      - status
      title: AllocationStudentSummary
    AnnouncementActorSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
      type: object
      required:
      - id
      - name
      title: AnnouncementActorSummary
    AnnouncementArchiveRequest:
      properties:
        reason:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Reason
      type: object
      title: AnnouncementArchiveRequest
    AnnouncementAudience:
      type: string
      enum:
      - all_students
      - active_students
      - pending_fee_students
      title: AnnouncementAudience
    AnnouncementCategory:
      type: string
      enum:
      - general
      - schedule
      - fees
      - policy
      - facility
      title: AnnouncementCategory
    AnnouncementCreate:
      properties:
        title:
          type: string
          maxLength: 120
          minLength: 5
          title: Title
        body:
          type: string
          maxLength: 1000
          minLength: 10
          title: Body
        category:
          $ref: '#/components/schemas/AnnouncementCategory'
          default: general
        priority:
          $ref: '#/components/schemas/AnnouncementPriority'
          default: normal
        audience:
