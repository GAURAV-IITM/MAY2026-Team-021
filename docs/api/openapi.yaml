  securitySchemes:
    BearerAuth:
      type: http
      description: Short-lived JWT access token returned by an authentication endpoint.
      scheme: bearer
    RefreshCookie:
      type: apiKey
      in: cookie
      name: smart_library_refresh_token
      description: Rotating HttpOnly refresh cookie set by browser-session authentication endpoints.
  headers:
    XRequestId:
      description: Correlation identifier for the request.
      schema:
        type: string
        example: req-7d566b29-8d93-4b09-8a22-b6ce8fba25c1
tags:
- name: System
  description: API discovery and health endpoints.
- name: Authentication
  description: Library registration, JWT sessions, current-user access, and account security.
- name: Students
  description: Tenant-scoped student profiles, statuses, and invitations.
- name: Floors
  description: Physical library floor management.
- name: Seats
  description: Physical seat records and operational statuses.
- name: Shifts
  description: Study shift definitions and overlap validation.
- name: Settings
  description: Library profile and operating preferences.
- name: Announcements
  description: Tenant-scoped owner announcement management and lifecycle commands.
- name: Seat requests
  description: Tenant-scoped owner review of student seat-change requests without allocation mutation.
- name: Reports
  description: Tenant-scoped Owner dashboard and operational reports computed from source domain records.
servers:
- url: /
  description: Current host
x-api-conventions:
  dates: YYYY-MM-DD
  dateTimes: ISO 8601 with timezone
  identifiers: UUID strings
  errors: Structured ErrorResponse with requestId
